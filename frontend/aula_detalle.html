<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor 11 — Detalle Aula</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <link rel="stylesheet" href="/static/css/dashboard_profesor.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .det-page { display:flex; flex-direction:column; min-height:100vh; background:var(--gray-50); }

    /* Topbar */
    .det-topbar { display:flex; align-items:center; gap:12px; padding:20px 20px 0; }
    .det-topbar__back { background:none; border:none; cursor:pointer; color:var(--gray-700); display:flex; align-items:center; padding:6px; border-radius:var(--radius-sm); }
    .det-topbar__back:hover { background:var(--gray-100); }
    .det-topbar__info { flex:1; }
    .det-topbar__name { font-size:1.15rem; font-weight:800; color:var(--gray-900); }
    .det-topbar__sub { font-size:0.78rem; color:var(--gray-500); font-weight:500; }

    /* Código de acceso */
    .det-code-bar { margin:12px 20px 0; background:#fff; border:1.5px solid var(--gray-200); border-radius:var(--radius-md); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
    .det-code-bar__label { font-size:0.75rem; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.4px; }
    .det-code-bar__code { font-size:1.4rem; font-weight:800; color:var(--orange-500); letter-spacing:3px; }
    .det-code-bar__copy { background:var(--orange-100); border:none; cursor:pointer; color:var(--orange-600); border-radius:var(--radius-sm); padding:6px 12px; font-size:0.78rem; font-weight:700; font-family:var(--font); }

    /* Tabs */
    .det-tabs { display:flex; gap:0; padding:16px 20px 0; border-bottom:1.5px solid var(--gray-200); margin:0 0 0; }
    .det-tab { flex:1; background:none; border:none; border-bottom:2.5px solid transparent; padding:10px 4px 12px; font-size:0.82rem; font-weight:600; color:var(--gray-400); cursor:pointer; font-family:var(--font); transition:color 0.2s; text-align:center; }
    .det-tab.active { color:var(--orange-500); border-bottom-color:var(--orange-500); }

    /* Panel content */
    .det-panel { padding:16px 20px; display:none; }
    .det-panel.active { display:block; }

    /* Estudiantes */
    .est-card { background:#fff; border:1.5px solid var(--gray-200); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:box-shadow 0.2s; }
    .est-card:hover { box-shadow:var(--shadow-card); }
    .est-avatar { width:40px; height:40px; border-radius:50%; background:var(--gray-100); overflow:hidden; border:2px solid var(--orange-100); flex-shrink:0; }
    .est-avatar img { width:100%; height:100%; object-fit:cover; }
    .est-info { flex:1; }
    .est-name { font-size:0.9rem; font-weight:700; color:var(--gray-900); }
    .est-tareas { font-size:0.75rem; color:var(--gray-400); }
    .est-arrow { color:var(--gray-300); }
    .est-empty { text-align:center; color:var(--gray-400); padding:40px 0; font-size:0.88rem; }

    /* Ranking */
    .rank-section { margin-bottom:20px; }
    .rank-section__title { font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--gray-500); margin-bottom:10px; }
    .rank-card { background:#fff; border:1.5px solid var(--gray-200); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; }
    .rank-pos { font-size:1rem; font-weight:800; color:var(--orange-500); width:28px; text-align:center; flex-shrink:0; }
    .rank-pos--top1 { color:#F59E0B; }
    .rank-pos--top2 { color:#9CA3AF; }
    .rank-pos--top3 { color:#92400E; }
    .rank-pos--bot { color:var(--error); }
    .rank-name { flex:1; font-size:0.9rem; font-weight:600; color:var(--gray-900); }
    .rank-pct { font-size:0.88rem; font-weight:700; color:var(--gray-700); }

    /* Stats grupo */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .stat-box { background:#fff; border:1.5px solid var(--gray-200); border-radius:var(--radius-md); padding:16px 12px; text-align:center; }
    .stat-box__val { font-size:1.8rem; font-weight:800; color:var(--gray-900); line-height:1; }
    .stat-box__label { font-size:0.7rem; font-weight:600; color:var(--gray-400); text-transform:uppercase; letter-spacing:0.4px; margin-top:4px; }

    /* Tareas */
    .tarea-card { background:#fff; border:1.5px solid var(--gray-200); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .tarea-info__title { font-size:0.9rem; font-weight:700; color:var(--gray-900); }
    .tarea-info__sub { font-size:0.76rem; color:var(--gray-400); margin-top:2px; }
    .tarea-progress { text-align:right; }
    .tarea-progress__nums { font-size:0.88rem; font-weight:700; color:var(--orange-500); }
    .tarea-progress__label { font-size:0.7rem; color:var(--gray-400); }

    .tarea-add-btn { width:100%; padding:14px; border:2px dashed var(--gray-300); border-radius:var(--radius-md); background:none; color:var(--gray-500); font-size:0.9rem; font-weight:600; font-family:var(--font); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:border-color 0.2s, color 0.2s; }
    .tarea-add-btn:hover { border-color:var(--orange-400); color:var(--orange-500); }

    /* Modal tarea */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s; }
    .modal-overlay.visible { opacity:1; pointer-events:all; }
    .modal-sheet { background:#fff; border-radius:24px 24px 0 0; padding:28px 24px 40px; width:100%; max-width:480px; transform:translateY(100%); transition:transform 0.3s ease; }
    .modal-overlay.visible .modal-sheet { transform:translateY(0); }
    .modal-title { font-size:1.1rem; font-weight:800; color:var(--gray-900); margin-bottom:20px; }
    .modal-field { margin-bottom:16px; }
    .modal-label { font-size:0.78rem; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; display:block; }
    .modal-input { width:100%; border:1.5px solid var(--gray-200); border-radius:var(--radius-md); padding:12px 14px; font-size:0.95rem; font-family:var(--font); outline:none; background:#fff; color:var(--gray-900); }
    .modal-input:focus { border-color:var(--orange-400); }
    .modal-btn { width:100%; padding:14px; border:none; border-radius:var(--radius-full); background:var(--orange-500); color:#fff; font-size:1rem; font-weight:700; font-family:var(--font); cursor:pointer; box-shadow:var(--shadow-btn); margin-top:8px; }
    .modal-btn:disabled { opacity:0.5; }
    .modal-err { color:var(--error); font-size:0.82rem; margin-top:8px; text-align:center; }

    /* Overlay de stats individuales */
    .stats-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:200; opacity:0; pointer-events:none; transition:opacity 0.2s; }
    .stats-overlay.visible { opacity:1; pointer-events:all; }
    .stats-sheet { background:#fff; border-radius:24px 24px 0 0; padding:24px 24px 40px; width:100%; max-width:480px; transform:translateY(100%); transition:transform 0.3s; max-height:80vh; overflow-y:auto; }
    .stats-overlay.visible .stats-sheet { transform:translateY(0); }
    .stats-sheet__header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .stats-sheet__avatar { width:52px; height:52px; border-radius:50%; background:var(--gray-100); overflow:hidden; border:2.5px solid var(--orange-200); flex-shrink:0; }
    .stats-sheet__avatar img { width:100%; height:100%; object-fit:cover; }
    .stats-sheet__name { font-size:1.05rem; font-weight:800; color:var(--gray-900); }
    .stats-sheet__close { margin-left:auto; background:none; border:none; cursor:pointer; color:var(--gray-400); font-size:1.2rem; }

    .loading-msg { text-align:center; color:var(--gray-400); padding:40px 0; }
  </style>
</head>
<body>
<div class="det-page">

  <!-- Topbar -->
  <div class="det-topbar">
    <button class="det-topbar__back" id="backBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="det-topbar__info">
      <div class="det-topbar__name" id="aulaNombre">—</div>
      <div class="det-topbar__sub" id="aulaMateria">—</div>
    </div>
  </div>

  <!-- Código de acceso -->
  <div class="det-code-bar">
    <div>
      <div class="det-code-bar__label">Código de acceso</div>
      <div class="det-code-bar__code" id="aulaCodigo">——</div>
    </div>
    <button class="det-code-bar__copy" id="copiarBtn">Copiar</button>
  </div>

  <!-- Tabs -->
  <div class="det-tabs">
    <button class="det-tab active" data-tab="estudiantes">Estudiantes</button>
    <button class="det-tab" data-tab="tareas">Tareas</button>
    <button class="det-tab" data-tab="ranking">Ranking</button>
    <button class="det-tab" data-tab="stats">Stats</button>
  </div>

  <!-- Panel: Estudiantes -->
  <div class="det-panel active" id="panel-estudiantes">
    <p class="loading-msg">Cargando...</p>
  </div>

  <!-- Panel: Tareas -->
  <div class="det-panel" id="panel-tareas">
    <p class="loading-msg">Cargando...</p>
  </div>

  <!-- Panel: Ranking -->
  <div class="det-panel" id="panel-ranking">
    <p class="loading-msg">Cargando...</p>
  </div>

  <!-- Panel: Stats grupo -->
  <div class="det-panel" id="panel-stats">
    <p class="loading-msg">Cargando...</p>
  </div>

</div>

<!-- Modal crear tarea -->
<div class="modal-overlay" id="tareaModal">
  <div class="modal-sheet">
    <div class="modal-title">Nueva Tarea</div>
    <div class="modal-field">
      <label class="modal-label" for="cantidadInput">Cantidad de preguntas</label>
      <input class="modal-input" id="cantidadInput" type="number" min="1" max="30" value="10" />
    </div>
    <div class="modal-err" id="tareaErr" hidden></div>
    <button class="modal-btn" id="guardarTareaBtn">Asignar Tarea</button>
  </div>
</div>

<!-- Overlay stats individuales -->
<div class="stats-overlay" id="statsOverlay">
  <div class="stats-sheet">
    <div class="stats-sheet__header">
      <div class="stats-sheet__avatar">
        <img id="statsAvatar" src="/static/img/avatares/buho_n.png" alt="Avatar" />
      </div>
      <div>
        <div class="stats-sheet__name" id="statsNombre">—</div>
      </div>
      <button class="stats-sheet__close" id="statsClose">✕</button>
    </div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-box__val" id="statsPct">—</div>
        <div class="stat-box__label">% Acierto</div>
      </div>
      <div class="stat-box">
        <div class="stat-box__val" id="statsResp">—</div>
        <div class="stat-box__label">Respondidas</div>
      </div>
      <div class="stat-box">
        <div class="stat-box__val" id="statsCorr">—</div>
        <div class="stat-box__label">Correctas</div>
      </div>
      <div class="stat-box">
        <div class="stat-box__val" id="statsTareas">—</div>
        <div class="stat-box__label">Tareas completadas</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = '/api/v1';
  const token = localStorage.getItem('access_token');
  const usuario = JSON.parse(localStorage.getItem('usuario') ?? 'null');
  if (!usuario) location.href = '/';

  const aulaId = new URLSearchParams(location.search).get('id');
  if (!aulaId) location.href = 'aulas_profesor.html';

  let aulaData = null;

  document.getElementById('backBtn').addEventListener('click', () => history.back());

  // ── Copiar código ──────────────────────────────────────────
  document.getElementById('copiarBtn').addEventListener('click', () => {
    const codigo = document.getElementById('aulaCodigo').textContent;
    navigator.clipboard?.writeText(codigo).then(() => {
      const btn = document.getElementById('copiarBtn');
      btn.textContent = '¡Copiado!';
      setTimeout(() => btn.textContent = 'Copiar', 1500);
    });
  });

  // ── Tabs ───────────────────────────────────────────────────
  document.querySelectorAll('.det-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.det-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.det-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
      if (tab.dataset.tab === 'ranking') cargarRanking();
      if (tab.dataset.tab === 'stats') cargarStats();
    });
  });

  // ── Cargar detalle del aula ────────────────────────────────
  async function cargarDetalle() {
    try {
      const res = await fetch(`${API}/profesor/aulas/${aulaId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) { location.href = 'aulas_profesor.html'; return; }
      aulaData = await res.json();

      document.getElementById('aulaNombre').textContent = aulaData.nombre;
      document.getElementById('aulaMateria').textContent = aulaData.materia_nombre ?? 'Sin materia';
      document.getElementById('aulaCodigo').textContent = aulaData.codigo_acceso;

      renderEstudiantes(aulaData.estudiantes);
      renderTareas(aulaData.tareas, aulaData.total_estudiantes);
    } catch {
      document.getElementById('panel-estudiantes').innerHTML = '<p class="loading-msg">Error de conexión</p>';
    }
  }

  // ── Render Estudiantes ─────────────────────────────────────
  function renderEstudiantes(lista) {
    const panel = document.getElementById('panel-estudiantes');
    if (!lista.length) {
      panel.innerHTML = '<p class="est-empty">Ningún estudiante se ha unido aún.<br>Comparte el código de acceso.</p>';
      return;
    }
    panel.innerHTML = lista.map(e => `
      <div class="est-card" data-est="${e.id}">
        <div class="est-avatar">
          <img src="${e.avatar ?? '/static/img/avatares/buho_n.png'}" alt="${e.username}" />
        </div>
        <div class="est-info">
          <div class="est-name">${e.username}</div>
          <div class="est-tareas">Tareas: ${e.tareas_completadas}/${e.total_tareas}</div>
        </div>
        <div class="est-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>
    `).join('');

    panel.querySelectorAll('.est-card').forEach(card => {
      card.addEventListener('click', () => verStatsEstudiante(parseInt(card.dataset.est)));
    });
  }

  // ── Render Tareas ──────────────────────────────────────────
  function renderTareas(lista, totalEst) {
    const panel = document.getElementById('panel-tareas');
    const tareasHtml = lista.map(t => {
      const fecha = new Date(t.creada_en).toLocaleDateString('es-CO', { day:'numeric', month:'short' });
      return `
        <div class="tarea-card">
          <div class="tarea-info">
            <div class="tarea-info__title">${t.cantidad_preguntas} preguntas</div>
            <div class="tarea-info__sub">${fecha}</div>
          </div>
          <div class="tarea-progress">
            <div class="tarea-progress__nums">${t.completada_por}/${totalEst}</div>
            <div class="tarea-progress__label">completaron</div>
          </div>
        </div>
      `;
    }).join('');

    panel.innerHTML = `
      ${tareasHtml}
      <button class="tarea-add-btn" id="nuevaTareaBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Asignar nueva tarea
      </button>
    `;

    document.getElementById('nuevaTareaBtn').addEventListener('click', () => {
      document.getElementById('tareaModal').classList.add('visible');
      document.getElementById('tareaErr').hidden = true;
    });
  }

  // ── Modal tarea ────────────────────────────────────────────
  document.getElementById('tareaModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('visible');
  });

  document.getElementById('guardarTareaBtn').addEventListener('click', async () => {
    const cantidad = parseInt(document.getElementById('cantidadInput').value);
    if (!cantidad || cantidad < 1 || cantidad > 30) {
      document.getElementById('tareaErr').textContent = 'Ingresa entre 1 y 30 preguntas';
      document.getElementById('tareaErr').hidden = false;
      return;
    }

    const btn = document.getElementById('guardarTareaBtn');
    btn.disabled = true;
    btn.textContent = 'Asignando...';
    document.getElementById('tareaErr').hidden = true;

    try {
      const res = await fetch(`${API}/profesor/aulas/${aulaId}/tareas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ cantidad_preguntas: cantidad }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('tareaErr').textContent = data.detail ?? 'Error al asignar';
        document.getElementById('tareaErr').hidden = false;
        return;
      }
      document.getElementById('tareaModal').classList.remove('visible');
      await cargarDetalle();
      // Mostrar tab de tareas
      document.querySelectorAll('.det-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.det-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="tareas"]').classList.add('active');
      document.getElementById('panel-tareas').classList.add('active');
    } catch {
      document.getElementById('tareaErr').textContent = 'Error de conexión';
      document.getElementById('tareaErr').hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Asignar Tarea';
    }
  });

  // ── Ranking ────────────────────────────────────────────────
  async function cargarRanking() {
    const panel = document.getElementById('panel-ranking');
    panel.innerHTML = '<p class="loading-msg">Cargando...</p>';
    try {
      const res = await fetch(`${API}/profesor/aulas/${aulaId}/ranking`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();

      const renderFila = (e, clasePos) => `
        <div class="rank-card">
          <div class="rank-pos ${clasePos}">${e.posicion}</div>
          <div class="rank-name">${e.username}</div>
          <div class="rank-pct">${e.porcentaje_acierto}%</div>
        </div>
      `;

      let html = '';
      if (data.top.length) {
        html += `<div class="rank-section"><div class="rank-section__title">🏆 Mejores en ${data.materia_nombre}</div>`;
        html += data.top.map((e, i) => renderFila(e, `rank-pos--top${i+1}`)).join('');
        html += '</div>';
      }
      if (data.bottom.length) {
        html += `<div class="rank-section"><div class="rank-section__title">💪 Necesitan apoyo</div>`;
        html += data.bottom.map(e => renderFila(e, 'rank-pos--bot')).join('');
        html += '</div>';
      }
      if (!html) html = '<p class="loading-msg">Aún no hay estadísticas para mostrar.</p>';

      panel.innerHTML = html;
    } catch {
      panel.innerHTML = '<p class="loading-msg">Error de conexión</p>';
    }
  }

  // ── Stats grupo ────────────────────────────────────────────
  async function cargarStats() {
    const panel = document.getElementById('panel-stats');
    panel.innerHTML = '<p class="loading-msg">Cargando...</p>';
    try {
      const res = await fetch(`${API}/profesor/aulas/${aulaId}/stats`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const d = await res.json();
      panel.innerHTML = `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-box__val">${d.promedio_acierto}%</div>
            <div class="stat-box__label">Promedio acierto</div>
          </div>
          <div class="stat-box">
            <div class="stat-box__val">${d.total_estudiantes}</div>
            <div class="stat-box__label">Estudiantes</div>
          </div>
          <div class="stat-box">
            <div class="stat-box__val">${d.total_respondidas}</div>
            <div class="stat-box__label">Preguntas respondidas</div>
          </div>
          <div class="stat-box">
            <div class="stat-box__val">${d.tareas_completadas_total}/${d.total_tareas * d.total_estudiantes || '—'}</div>
            <div class="stat-box__label">Tareas completadas</div>
          </div>
        </div>
        <div style="text-align:center;color:var(--gray-400);font-size:0.8rem;margin-top:8px;">Materia: ${d.materia_nombre}</div>
      `;
    } catch {
      panel.innerHTML = '<p class="loading-msg">Error de conexión</p>';
    }
  }

  // ── Stats individuales ─────────────────────────────────────
  async function verStatsEstudiante(estId) {
    const overlay = document.getElementById('statsOverlay');
    overlay.classList.add('visible');
    document.getElementById('statsNombre').textContent = '...';
    try {
      const res = await fetch(`${API}/profesor/aulas/${aulaId}/estudiantes/${estId}/stats`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const d = await res.json();
      document.getElementById('statsAvatar').src = d.avatar ?? '/static/img/avatares/buho_n.png';
      document.getElementById('statsNombre').textContent = d.username;
      document.getElementById('statsPct').textContent = d.porcentaje_acierto + '%';
      document.getElementById('statsResp').textContent = d.total_respondidas;
      document.getElementById('statsCorr').textContent = d.total_correctas;
      document.getElementById('statsTareas').textContent = `${d.tareas_completadas}/${d.total_tareas}`;
    } catch {
      document.getElementById('statsNombre').textContent = 'Error al cargar';
    }
  }

  document.getElementById('statsClose').addEventListener('click', () => {
    document.getElementById('statsOverlay').classList.remove('visible');
  });
  document.getElementById('statsOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('visible');
  });

  // Init
  cargarDetalle();
</script>
</body>
</html>
