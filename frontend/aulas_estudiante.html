<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/static/js/auth_fetch.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor 11 — Mis Aulas</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F8FAFC; min-height: 100vh; }

    /* ── Topbar ───────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 16px;
      position: relative;
    }
    .topbar__back {
      position: absolute;
      left: 20px;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #F97316;
      border: none;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(249,115,22,0.4);
    }
    .topbar__title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0F172A;
    }

    /* ── Barra unirse ─────────────────────────────────────── */
    .join-bar {
      margin: 4px 16px 16px;
      display: flex;
      gap: 10px;
      background: #fff;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      align-items: center;
    }
    .join-bar__input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: #0F172A;
      background: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .join-bar__input::placeholder {
      color: #CBD5E1;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .join-bar__btn {
      background: #F97316;
      border: none;
      cursor: pointer;
      color: #fff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 3px 10px rgba(249,115,22,0.35);
      white-space: nowrap;
    }
    .join-bar__btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .join-msg {
      text-align: center;
      font-size: 0.8rem;
      min-height: 18px;
      margin: -10px 20px 10px;
    }
    .join-msg.ok  { color: #16A34A; }
    .join-msg.err { color: #EF4444; }

    /* ── Lista ────────────────────────────────────────────── */
    .aulas-list {
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .aula-card {
      background: #fff;
      border-radius: 20px;
      padding: 18px 18px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .aula-card__top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding-bottom: 14px;
    }

    .aula-card__icon {
      width: 54px; height: 54px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .aula-card__info { flex: 1; min-width: 0; }
    .aula-card__name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.2;
    }
    .aula-card__materia {
      font-size: 0.78rem;
      color: #94A3B8;
      font-weight: 500;
      margin-top: 3px;
    }

    .aula-card__badge {
      background: #FFF7ED;
      color: #F97316;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      align-self: center;
    }

    /* ── Sección tareas ───────────────────────────────────── */
    .tareas-section {
      border-top: 1px solid #F1F5F9;
    }

    .tareas-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94A3B8;
      padding: 10px 0 6px;
    }

    .tarea-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid #F8FAFC;
      cursor: pointer;
      transition: background 0.15s;
      margin: 0 -18px;
      padding-left: 18px;
      padding-right: 18px;
    }
    .tarea-row:hover { background: #F8FAFC; }
    .tarea-row:first-child { border-top: 1px solid #F1F5F9; }

    .tarea-row__title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #0F172A;
    }
    .tarea-row__sub {
      font-size: 0.74rem;
      color: #94A3B8;
      margin-top: 2px;
    }
    .tarea-row__status {
      font-size: 0.78rem;
      font-weight: 700;
    }
    .tarea-row__status.done       { color: #16A34A; }
    .tarea-row__status.pending    { color: #F97316; }
    .tarea-row__status.in-progress { color: #3B82F6; }

    .no-tareas {
      font-size: 0.82rem;
      color: #CBD5E1;
      padding: 10px 0 16px;
      text-align: center;
    }

    /* ── Empty / Loading ──────────────────────────────────── */
    .ae-empty {
      text-align: center;
      padding: 60px 20px;
      color: #94A3B8;
      font-size: 0.9rem;
    }
    .ae-empty__icon { font-size: 3rem; margin-bottom: 12px; }
    .loading-msg { text-align: center; color: #94A3B8; padding: 40px 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="topbar__back" id="backBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <span class="topbar__title">Mis Aulas</span>
  </div>

  <!-- Unirse con código -->
  <div class="join-bar">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
      fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <input class="join-bar__input" id="codigoInput" type="text" placeholder="Código de acceso" maxlength="10" />
    <button class="join-bar__btn" id="unirseBtn">Unirse</button>
  </div>
  <div class="join-msg" id="joinMsg"></div>

  <div class="aulas-list" id="aulasList">
    <p class="loading-msg">Cargando...</p>
  </div>

<script>
  const API = '/api/v1';
  const token = localStorage.getItem('access_token');
  const usuario = JSON.parse(localStorage.getItem('usuario') ?? 'null');
  if (!usuario) location.href = '/';

  const COLORES = ['#F97316','#3B82F6','#22C55E','#A855F7','#EC4899','#EF4444','#EAB308','#06B6D4'];

  const LIBRO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;

  document.getElementById('backBtn').addEventListener('click', () => location.href = 'dashboard_estudiante.html');

  // ── Unirse a aula ──────────────────────────────────────────
  const codigoInput = document.getElementById('codigoInput');
  const joinMsg = document.getElementById('joinMsg');

  codigoInput.addEventListener('input', () => {
    codigoInput.value = codigoInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  document.getElementById('unirseBtn').addEventListener('click', async () => {
    const codigo = codigoInput.value.trim();
    if (!codigo) { setMsg('Ingresa el código', 'err'); return; }

    const btn = document.getElementById('unirseBtn');
    btn.disabled = true;
    btn.textContent = '...';
    joinMsg.className = 'join-msg';
    joinMsg.textContent = '';

    try {
      const res = await fetch(`${API}/estudiante/aulas/unirse`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ codigo }),
      });
      const data = await res.json();
      if (!res.ok) { setMsg(data.detail ?? 'Código inválido', 'err'); return; }
      setMsg(`¡Te uniste a ${data.nombre}!`, 'ok');
      codigoInput.value = '';
      await cargarAulas();
    } catch {
      setMsg('Error de conexión', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Unirse';
    }
  });

  function setMsg(txt, tipo) {
    joinMsg.textContent = txt;
    joinMsg.className = `join-msg ${tipo}`;
  }

  // ── Cargar aulas ───────────────────────────────────────────
  async function cargarAulas() {
    const lista = document.getElementById('aulasList');
    try {
      const res = await fetch(`${API}/estudiante/aulas`, { headers: { Authorization: `Bearer ${token}` } });
      const aulas = await res.json();

      if (!aulas.length) {
        lista.innerHTML = `
          <div class="ae-empty">
            <div class="ae-empty__icon">🎓</div>
            <div>Aún no estás en ningún aula.<br>Ingresa el código de acceso de tu profesor.</div>
          </div>`;
        return;
      }

      lista.innerHTML = aulas.map((a, i) => {
        const hex = a.color_hex || COLORES[i % COLORES.length];
        const pendientes = (a.tareas ?? []).filter(t => !t.completada).length;

        const badgeHtml = pendientes > 0
          ? `<span class="aula-card__badge">${pendientes} pendiente${pendientes > 1 ? 's' : ''}</span>`
          : '';

        const tareasHtml = (a.tareas ?? []).length === 0
          ? `<div class="no-tareas">Sin tareas asignadas aún</div>`
          : (a.tareas ?? []).map(t => {
              const fecha = new Date(t.creada_en).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
              let statusClass = 'pending', statusTxt = 'Pendiente';
              if (t.completada) { statusClass = 'done'; statusTxt = '✓ Completada'; }
              else if (t.sesion_id) { statusClass = 'in-progress'; statusTxt = 'En progreso'; }
              return `
                <div class="tarea-row" data-tarea="${t.id}" data-completada="${t.completada}">
                  <div>
                    <div class="tarea-row__title">${t.cantidad_preguntas} preguntas</div>
                    <div class="tarea-row__sub">${fecha}</div>
                  </div>
                  <div class="tarea-row__status ${statusClass}">${statusTxt}</div>
                </div>`;
            }).join('');

        return `
          <div class="aula-card">
            <div class="aula-card__top">
              <div class="aula-card__icon" style="background:${hex};">
                ${LIBRO_SVG}
              </div>
              <div class="aula-card__info">
                <div class="aula-card__name">${a.nombre}</div>
                <div class="aula-card__materia">${a.materia_nombre ?? 'Sin materia'}</div>
              </div>
              ${badgeHtml}
            </div>
            <div class="tareas-section">
              ${(a.tareas ?? []).length > 0 ? `<div class="tareas-title">Tareas</div>` : ''}
              ${tareasHtml}
            </div>
          </div>`;
      }).join('');

      lista.querySelectorAll('.tarea-row').forEach(row => {
        row.addEventListener('click', () => {
          if (row.dataset.completada === 'true') return;
          iniciarTarea(parseInt(row.dataset.tarea));
        });
      });

    } catch {
      lista.innerHTML = '<p class="loading-msg">Error de conexión</p>';
    }
  }

  // ── Iniciar tarea ──────────────────────────────────────────
  async function iniciarTarea(tareaId) {
    try {
      const res = await fetch(`${API}/estudiante/tareas/${tareaId}/iniciar`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) { alert(data.detail ?? 'No se pudo iniciar la tarea'); return; }

      sessionStorage.setItem('tarea_estado', JSON.stringify({
        tareaId,
        sesionId: data.sesion_id,
        preguntas: data.preguntas,
        materiaId: data.materia_id,
        materialNombre: data.materia_nombre,
        cantidadPreguntas: data.cantidad_preguntas,
      }));
      location.href = 'pregunta_tarea.html';
    } catch {
      alert('Error de conexión');
    }
  }

  cargarAulas();
</script>
</body>
</html>
