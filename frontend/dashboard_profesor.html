<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor 11 — Profesor</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <link rel="stylesheet" href="/static/css/dashboard_profesor.css" />
  <style>
    .seg-card { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--gray-100); }
    .seg-card:last-child { border-bottom:none; }
    .seg-avatar { width:38px; height:38px; border-radius:50%; background:var(--gray-100); overflow:hidden; border:2px solid var(--orange-100); flex-shrink:0; }
    .seg-avatar img { width:100%; height:100%; object-fit:cover; }
    .seg-info { flex:1; min-width:0; }
    .seg-name { font-size:0.85rem; font-weight:700; color:var(--gray-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .seg-meta { font-size:0.72rem; color:var(--gray-400); margin-top:1px; }
    .seg-pct { font-size:0.85rem; font-weight:800; color:var(--orange-500); flex-shrink:0; }
    .seg-link { background:none; border:none; cursor:pointer; color:var(--gray-300); padding:4px; display:flex; align-items:center; }
    .seg-link:hover { color:var(--orange-500); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="dash-body">
  <div class="dash-page">

    <!-- ── Título ──────────────────────────────────────────── -->
    <header class="prof-header">
      <h1 class="prof-title">Mentor 11</h1>
    </header>

    <!-- ── Stats ───────────────────────────────────────────── -->
    <section class="prof-stats">

      <div class="prof-stat-card">
        <span class="prof-stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            <line x1="12" y1="12" x2="12" y2="16"/>
            <line x1="10" y1="14" x2="14" y2="14"/>
          </svg>
        </span>
        <span class="prof-stat-card__value" id="statAulas">0</span>
        <span class="prof-stat-card__label">Aulas</span>
      </div>

      <div class="prof-stat-card">
        <span class="prof-stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="prof-stat-card__value" id="statEstudiantes">0</span>
        <span class="prof-stat-card__label">Estudiantes</span>
      </div>

      <div class="prof-stat-card">
        <span class="prof-stat-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </span>
        <span class="prof-stat-card__value" id="statTareas">0</span>
        <span class="prof-stat-card__label">Tareas</span>
      </div>

    </section>

    <!-- ── Botones principales ──────────────────────────────── -->
    <section class="prof-actions">
      <button class="prof-btn prof-btn--orange" onclick="location.href='aulas_profesor.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Mis Aulas
      </button>

      <button class="prof-btn prof-btn--blue" onclick="location.href='aulas_profesor.html?crear=1'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Crear Aula
      </button>
    </section>

    <!-- ── Seguimiento personalizado ───────────────────────── -->
    <section class="prof-preview" id="seguimientoSection" style="display:none">
      <div class="prof-preview__card">
        <div class="prof-preview__bookmark">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="var(--orange-500)" stroke="var(--orange-500)" stroke-width="1">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray-500);margin-bottom:10px;">
          📌 En seguimiento
        </div>
        <div id="seguimientoGrid"></div>
      </div>
    </section>


    <!-- ── Logout ────────────────────────────────────────────── -->
    <div style="padding:16px 20px 32px;text-align:center;">
      <button id="profileBtn" style="background:none;border:1.5px solid var(--gray-200);border-radius:var(--radius-full);padding:10px 28px;font-size:0.85rem;font-weight:600;color:var(--gray-500);cursor:pointer;font-family:var(--font);">
        Cerrar sesión
      </button>
    </div>

  </div>
  <!-- Overlay stats de seguimiento -->
  <div id="segOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;justify-content:center;">
    <div id="segSheet" style="background:#fff;border-radius:24px 24px 0 0;padding:24px 24px 40px;width:100%;max-width:480px;transform:translateY(100%);transition:transform 0.3s;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--gray-100);overflow:hidden;border:2.5px solid var(--orange-200);flex-shrink:0;">
          <img id="segOvAvatar" src="/static/img/avatares/buho_n.png" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <div style="flex:1;">
          <div id="segOvNombre" style="font-size:1.05rem;font-weight:800;color:var(--gray-900);">—</div>
          <div id="segOvMeta" style="font-size:0.75rem;color:var(--gray-400);margin-top:2px;">—</div>
        </div>
        <button id="segOvClose" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:1.2rem;padding:4px;">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
        <div style="background:#fff;border:1.5px solid var(--gray-200);border-radius:14px;padding:16px 12px;text-align:center;">
          <div id="segOvPct" style="font-size:1.8rem;font-weight:800;color:var(--gray-900);line-height:1;">—</div>
          <div style="font-size:0.7rem;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.4px;margin-top:4px;">% Acierto</div>
        </div>
        <div style="background:#fff;border:1.5px solid var(--gray-200);border-radius:14px;padding:16px 12px;text-align:center;">
          <div id="segOvResp" style="font-size:1.8rem;font-weight:800;color:var(--gray-900);line-height:1;">—</div>
          <div style="font-size:0.7rem;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.4px;margin-top:4px;">Respondidas</div>
        </div>
        <div style="background:#fff;border:1.5px solid var(--gray-200);border-radius:14px;padding:16px 12px;text-align:center;">
          <div id="segOvCorr" style="font-size:1.8rem;font-weight:800;color:var(--gray-900);line-height:1;">—</div>
          <div style="font-size:0.7rem;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.4px;margin-top:4px;">Correctas</div>
        </div>
        <div style="background:#fff;border:1.5px solid var(--gray-200);border-radius:14px;padding:16px 12px;text-align:center;">
          <div id="segOvTareas" style="font-size:1.8rem;font-weight:800;color:var(--gray-900);line-height:1;">—</div>
          <div style="font-size:0.7rem;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.4px;margin-top:4px;">Tareas completadas</div>
        </div>
      </div>
      <button id="segOvDejarBtn" style="width:100%;padding:12px;border:1.5px solid var(--gray-200);border-radius:9999px;background:var(--gray-100);color:var(--gray-500);font-size:0.9rem;font-weight:700;font-family:var(--font);cursor:pointer;">
        📌 Dejar de seguir
      </button>
    </div>
  </div>

  <script src="/static/js/dashboard_profesor.js"></script>
  <script>
    const API = '/api/v1';
    const _tok = localStorage.getItem('access_token');

    // ── Overlay de seguimiento ─────────────────────────────
    const segOverlay = document.getElementById('segOverlay');
    const segSheet   = document.getElementById('segSheet');
    let _segEstId = null, _segAulaId = null;

    function abrirSegOverlay(item) {
      _segEstId  = item.estudiante_id;
      _segAulaId = item.aula_id;
      document.getElementById('segOvAvatar').src  = item.avatar ?? '/static/img/avatares/buho_n.png';
      document.getElementById('segOvNombre').textContent = item.username;
      document.getElementById('segOvMeta').textContent   = `${item.aula_nombre} · ${item.materia_nombre ?? ''} · Tareas ${item.tareas_completadas}/${item.total_tareas}`;
      document.getElementById('segOvPct').textContent    = item.porcentaje_acierto + '%';
      document.getElementById('segOvResp').textContent   = item.total_respondidas;
      document.getElementById('segOvCorr').textContent   = '...';
      document.getElementById('segOvTareas').textContent = `${item.tareas_completadas}/${item.total_tareas}`;

      segOverlay.style.display = 'flex';
      requestAnimationFrame(() => segSheet.style.transform = 'translateY(0)');

      // Cargar correctas desde el endpoint de stats individuales
      fetch(`${API}/profesor/aulas/${item.aula_id}/estudiantes/${item.estudiante_id}/stats`, {
        headers: { Authorization: `Bearer ${_tok}` },
      }).then(r => r.json()).then(d => {
        document.getElementById('segOvCorr').textContent = d.total_correctas;
      }).catch(() => {
        document.getElementById('segOvCorr').textContent = '—';
      });
    }

    function cerrarSegOverlay() {
      segSheet.style.transform = 'translateY(100%)';
      setTimeout(() => { segOverlay.style.display = 'none'; }, 300);
    }

    document.getElementById('segOvClose').addEventListener('click', cerrarSegOverlay);
    segOverlay.addEventListener('click', e => { if (e.target === segOverlay) cerrarSegOverlay(); });

    document.getElementById('segOvDejarBtn').addEventListener('click', async () => {
      if (!_segEstId || !_segAulaId) return;
      const btn = document.getElementById('segOvDejarBtn');
      btn.disabled = true;
      try {
        const res = await fetch(
          `${API}/profesor/aulas/${_segAulaId}/estudiantes/${_segEstId}/seguimiento?marcar=false`,
          { method: 'PUT', headers: { Authorization: `Bearer ${_tok}` } }
        );
        if (res.ok) {
          cerrarSegOverlay();
          await cargarSeguimiento(); // refrescar la lista
        }
      } catch {}
      btn.disabled = false;
    });

    // ── Cargar lista de seguimiento ────────────────────────
    async function cargarSeguimiento() {
      try {
        const res = await fetch(`${API}/profesor/seguimiento`, {
          headers: { Authorization: `Bearer ${_tok}` },
        });
        if (!res.ok) return;
        const lista = await res.json();

        const section = document.getElementById('seguimientoSection');
        const grid    = document.getElementById('seguimientoGrid');

        if (!lista.length) { section.style.display = 'none'; return; }

        section.style.display = '';
        grid.innerHTML = lista.map((e, i) => `
          <div class="seg-card" data-idx="${i}" style="cursor:pointer;">
            <div class="seg-avatar">
              <img src="${e.avatar ?? '/static/img/avatares/buho_n.png'}" alt="${e.username}" />
            </div>
            <div class="seg-info">
              <div class="seg-name">${e.username}</div>
              <div class="seg-meta">${e.aula_nombre} · ${e.materia_nombre ?? ''} · Tareas ${e.tareas_completadas}/${e.total_tareas}</div>
            </div>
            <div class="seg-pct">${e.porcentaje_acierto}%</div>
            <span class="seg-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </span>
          </div>
        `).join('');

        // Guardar lista para acceder en click
        grid.querySelectorAll('.seg-card').forEach(card => {
          card.addEventListener('click', () => abrirSegOverlay(lista[parseInt(card.dataset.idx)]));
        });
      } catch {}
    }

    cargarSeguimiento();
  </script>
</body>
</html>
