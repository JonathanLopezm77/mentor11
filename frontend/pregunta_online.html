<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor 11 — Online</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/libre.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet" />
  <style>
    /* ── Banner VS con avatares en los bordes y barras debajo ── */
    .vs-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: #1c1917;
      margin: 10px 16px 0;
      padding: 14px 14px 12px;
      border-radius: 18px;
    }
    .vs-banner__side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 38%;
    }
    .vs-banner__avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2.5px solid var(--orange-500);
      background: var(--orange-100);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .vs-banner__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .vs-banner__avatar span { font-weight: 800; color: var(--orange-600); font-size: 1.4rem; }
    .vs-banner__name {
      font-size: .68rem;
      font-weight: 700;
      color: #cbd5e1;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vs-banner__bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, .14);
      border-radius: 99px;
      overflow: hidden;
    }
    .vs-banner__bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width .4s ease;
    }
    .vs-banner__bar-fill--yo    { background: var(--orange-500); }
    .vs-banner__bar-fill--rival { background: #f59e0b; }
    .vs-banner__badge {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform: rotate(-8deg);
      margin-top: 8px;
    }
    .vs-banner__badge span {
      font-family: 'Bangers', 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 2.6rem;
      line-height: 1;
      color: #fff;
      -webkit-text-stroke: 2px #000;
      letter-spacing: .02em;
    }

    /* ── Overlays de fin de partida ── */
    .overlay-fin {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 32px 24px;
    }
    .overlay-fin--active { display: flex; }
    .overlay-fin__card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .overlay-fin__icon  { font-size: 4rem; line-height: 1; }
    .overlay-fin__title { font-size: 1.7rem; font-weight: 800; color: var(--gray-900); }
    .overlay-fin__sub   { font-size: .92rem; color: var(--gray-500); }
    .overlay-fin__btn   {
      margin-top: 8px;
      padding: 14px 32px;
      background: var(--orange-500);
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      width: 100%;
    }
  </style>
</head>
<body class="libre-body">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="libre-header">
    <button class="libre-back" id="backBtn" aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 class="libre-header__title">Online</h1>
    <span class="libre-contador" id="contador">1 / ?</span>
  </header>

  <!-- ── Banner VS: avatares en los bordes, barras debajo ───── -->
  <div class="vs-banner">
    <div class="vs-banner__side">
      <div class="vs-banner__avatar" id="vsAvatarYo"><span id="vsIniYo">?</span></div>
      <span class="vs-banner__name" id="labelYo">Tú</span>
      <div class="vs-banner__bar-track"><div class="vs-banner__bar-fill vs-banner__bar-fill--yo" id="barYo"></div></div>
    </div>
    <div class="vs-banner__badge"><span>VS</span></div>
    <div class="vs-banner__side">
      <div class="vs-banner__avatar" id="vsAvatarRival"><span id="vsIniRival">?</span></div>
      <span class="vs-banner__name" id="labelRival">Rival</span>
      <div class="vs-banner__bar-track"><div class="vs-banner__bar-fill vs-banner__bar-fill--rival" id="barRival"></div></div>
    </div>
  </div>

  <!-- ── Contenido principal ────────────────────────────────── -->
  <main class="pregunta-main">
    <div class="pregunta-card">
      <p class="pregunta-enunciado" id="enunciado">Conectando...</p>
    </div>
    <div class="opciones-grid" id="opcionesGrid"></div>
    <div class="pregunta-explicacion" id="explicacion" hidden></div>
  </main>

  <!-- ── Botón siguiente ────────────────────────────────────── -->
  <div class="libre-footer">
    <button class="libre-cta" id="siguienteBtn" hidden>Siguiente →</button>
  </div>

  <!-- ── Overlay: ganaste ───────────────────────────────────── -->
  <div class="overlay-fin" id="overlayGana">
    <div class="overlay-fin__card">
      <span class="overlay-fin__icon">🏆</span>
      <p class="overlay-fin__title">¡Ganaste!</p>
      <p class="overlay-fin__sub" id="ganaSubtitle">¡Excelente!</p>
      <button class="overlay-fin__btn" id="btnGanaOk">Volver al inicio</button>
    </div>
  </div>

  <!-- ── Overlay: perdiste ──────────────────────────────────── -->
  <div class="overlay-fin" id="overlayPierde">
    <div class="overlay-fin__card">
      <span class="overlay-fin__icon">😔</span>
      <p class="overlay-fin__title">¡Tu rival ganó!</p>
      <p class="overlay-fin__sub" id="pierdeSubtitle">Sigue practicando, ¡la próxima es tuya!</p>
      <button class="overlay-fin__btn" id="btnPierdeOk">Volver al inicio</button>
    </div>
  </div>

  <!-- ── Overlay: empate ───────────────────────────────────── -->
  <div class="overlay-fin" id="overlayEmpate">
    <div class="overlay-fin__card">
      <span class="overlay-fin__icon">🤝</span>
      <p class="overlay-fin__title">¡Empate!</p>
      <p class="overlay-fin__sub" id="empateSubtitle">Los dos respondieron igual de bien.</p>
      <button class="overlay-fin__btn" id="btnEmpateOk">Volver al inicio</button>
    </div>
  </div>

  <!-- ── Overlay: rival desconectado ───────────────────────── -->
  <div class="overlay-fin" id="overlayDesc">
    <div class="overlay-fin__card">
      <span class="overlay-fin__icon">🔌</span>
      <p class="overlay-fin__title">Rival desconectado</p>
      <p class="overlay-fin__sub">Tu rival abandonó la partida.</p>
      <button class="overlay-fin__btn" id="btnDescOk">Volver al inicio</button>
    </div>
  </div>

  <script>
    // ── Sonidos ────────────────────────────────────────────────
    const SFX = {};
    [['/static/correcta.mp3',.8],['/static/error.mp3',.8],
     ['/static/sig_pregun.mp3',.7],['/static/arcade_stat.mp3',.6]].forEach(([src,vol]) => {
      const a = new Audio(src); a.preload = 'auto'; a.volume = vol; SFX[src] = a;
    });
    const play = src => { const a = SFX[src]; if (!a) return; a.currentTime = 0; a.play().catch(()=>{}); };

    // ── Estado desde sessionStorage ───────────────────────────
    const API = '/api/v1';
    const token = localStorage.getItem('access_token');
    const onlineState = JSON.parse(sessionStorage.getItem('online_state') ?? 'null');

    if (!token || !onlineState) { location.replace('online_intro.html'); }

    const { room_id, rival, modo, username } = onlineState;

    document.getElementById('labelYo').textContent = username ?? 'Tú';
    document.getElementById('labelRival').textContent = rival ?? 'Rival';

    // ── Banner VS: avatares ────────────────────────────────────
    document.getElementById('vsIniYo').textContent = (username ?? '?').charAt(0).toUpperCase();
    document.getElementById('vsIniRival').textContent = (rival ?? '?').charAt(0).toUpperCase();

    function pintarAvatar(contenedorId, iniId, src) {
      if (!src) return;
      const cont = document.getElementById(contenedorId);
      const ini = document.getElementById(iniId);
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Avatar';
      cont.insertBefore(img, ini);
      ini.hidden = true;
    }

    if (onlineState.rival_avatar) pintarAvatar('vsAvatarRival', 'vsIniRival', onlineState.rival_avatar);

    (async () => {
      try {
        const res = await fetch(`${API}/perfil/avatar`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) return;
        const data = await res.json();
        if (data.imagen_src) pintarAvatar('vsAvatarYo', 'vsIniYo', data.imagen_src);
      } catch (_) {}
    })();

    let ws = null;
    let respondida = false;
    let partidaTerminada = false;

    // ── Restaurar progreso si hubo recarga ────────────────────
    const _progreso = JSON.parse(sessionStorage.getItem('online_progreso') ?? 'null');
    let sesionId    = _progreso?.sesionId    ?? null;
    let preguntas   = _progreso?.preguntas   ?? [];
    let actual      = _progreso?.actual      ?? 0;
    let correctas   = _progreso?.correctas   ?? 0;
    let incorrectas = _progreso?.incorrectas ?? 0;

    function guardarProgreso() {
      sessionStorage.setItem('online_progreso', JSON.stringify({ sesionId, preguntas, actual, correctas, incorrectas }));
    }

    // ── WebSocket ─────────────────────────────────────────────
    function conectarWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/online?token=${token}&username=${encodeURIComponent(username)}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join_room', room_id }));
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'rival_progress') {
          document.getElementById('barRival').style.width = (data.value ?? 0) + '%';
        }

        if (data.type === 'resultado') {
          const total = preguntas.length || '?';
          if (data.empate) {
            document.getElementById('empateSubtitle').textContent =
              `Ambos con ${data.mis_correctas} / ${total} correctas.`;
            mostrarOverlay('overlayEmpate');
          } else if (data.ganaste) {
            document.getElementById('ganaSubtitle').textContent =
              `Tú: ${data.mis_correctas} correctas · Rival: ${data.rival_correctas} correctas`;
            mostrarOverlay('overlayGana');
          } else {
            document.getElementById('pierdeSubtitle').textContent =
              `Rival: ${data.rival_correctas} correctas · Tú: ${data.mis_correctas} correctas`;
            mostrarOverlay('overlayPierde');
          }
        }

        if (data.type === 'rival_disconnected') {
          mostrarOverlay('overlayGana'); // si el rival se va, ganas tú
        }

        if (data.type === 'room_not_found') {
          // La sala ya no existe — se continúa sin rival
        }
      };

      ws.onerror = () => {};
      ws.onclose = () => {};
    }

    function enviarProgreso() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const total = preguntas.length;
      const pct = total > 0 ? Math.round((actual / total) * 100) : 0;
      ws.send(JSON.stringify({ type: 'progress', value: pct }));
      document.getElementById('barYo').style.width = pct + '%';
    }

    function enviarFinish() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'finish' }));
    }

    // ── Cargar materias y preguntas ───────────────────────────
    async function init() {
      conectarWS();

      // Si hay progreso guardado (recarga), restaurar directamente
      if (_progreso && preguntas.length > 0) {
        const pct = preguntas.length > 0 ? Math.round((correctas / preguntas.length) * 100) : 0;
        document.getElementById('barYo').style.width = pct + '%';
        mostrarPregunta();
        return;
      }

      try {
        let materiaIds;
        let cantidad;

        if (modo === 'libre' && onlineState.materia_ids) {
          materiaIds = onlineState.materia_ids.join(',');
          cantidad = onlineState.cantidad ?? 10;
        } else {
          const matRes = await fetch(`${API}/juego/materias`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!matRes.ok) throw new Error('materias');
          const materias = await matRes.json();
          materiaIds = materias.map(m => m.id).join(',');
          cantidad = 10;
        }

        // Crear sesión
        const sesRes = await fetch(`${API}/juego/sesiones`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({
            modo_juego: modo === 'libre' ? 'libre' : 'aleatorio',
            materia_ids: materiaIds.split(',').map(Number),
            total_preguntas: cantidad,
          })
        });
        if (!sesRes.ok) throw new Error('sesion');
        const sesData = await sesRes.json();
        sesionId = sesData.sesion_id;

        // Cargar preguntas
        const pRes = await fetch(
          `${API}/juego/preguntas?materia_ids=${materiaIds}&cantidad=${cantidad}`,
          { headers: { Authorization: `Bearer ${token}` } }
        );
        if (!pRes.ok) throw new Error('preguntas');
        preguntas = await pRes.json();

        if (!preguntas.length) {
          document.getElementById('enunciado').textContent = 'No hay preguntas disponibles.';
          return;
        }

        guardarProgreso();
        mostrarPregunta();
      } catch (err) {
        console.error('[Online] Error init:', err);
        document.getElementById('enunciado').textContent = 'Error de conexión. Recarga.';
      }
    }

    // ── Mostrar pregunta ──────────────────────────────────────
    function mostrarPregunta() {
      if (actual >= preguntas.length) {
        finalizarPartida();
        return;
      }
      respondida = false;

      const p = preguntas[actual];
      document.getElementById('contador').textContent = `${actual + 1} / ${preguntas.length}`;
      document.getElementById('enunciado').textContent = p.enunciado;
      document.getElementById('explicacion').hidden = true;
      document.getElementById('explicacion').textContent = '';
      document.getElementById('siguienteBtn').hidden = true;

      const grid = document.getElementById('opcionesGrid');
      grid.innerHTML = '';
      p.opciones.forEach(op => {
        const btn = document.createElement('button');
        btn.className = 'opcion-btn';
        btn.dataset.id = op.id;
        btn.innerHTML = `<span class="opcion-letra">${op.letra}</span><span class="opcion-texto">${op.texto}</span>`;
        btn.addEventListener('click', () => responder(op.id, p.id));
        grid.appendChild(btn);
      });
    }

    // ── Responder ─────────────────────────────────────────────
    async function responder(opcionId, preguntaId) {
      if (respondida || partidaTerminada) return;
      respondida = true;
      document.querySelectorAll('.opcion-btn').forEach(b => b.disabled = true);

      try {
        const res = await fetch(`${API}/juego/sesiones/${sesionId}/responder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ pregunta_id: preguntaId, opcion_id: opcionId })
        });
        const data = await res.json();

        document.querySelectorAll('.opcion-btn').forEach(btn => {
          const id = Number(btn.dataset.id);
          if (id === data.opcion_correcta_id) btn.classList.add('opcion-btn--correcta');
          else if (id === opcionId && !data.es_correcta) btn.classList.add('opcion-btn--incorrecta');
        });

        if (data.es_correcta) {
          correctas++;
          play('/static/correcta.mp3');
        } else {
          incorrectas++;
          play('/static/error.mp3');
        }

        // Barra llena según respuestas correctas
        const pct = Math.round((correctas / preguntas.length) * 100);
        document.getElementById('barYo').style.width = pct + '%';
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'progress', value: pct }));
        }

        guardarProgreso();

        if (data.explicacion) {
          const exp = document.getElementById('explicacion');
          exp.textContent = `💡 ${data.explicacion}`;
          exp.hidden = false;
        }

        const siguienteIdx = actual + 1;
        if (siguienteIdx >= preguntas.length) {
          document.getElementById('siguienteBtn').textContent = 'Ver resultado';
          document.getElementById('siguienteBtn').hidden = false;
        } else {
          if (data.es_correcta) {
            setTimeout(() => { actual++; guardarProgreso(); mostrarPregunta(); }, 900);
          } else {
            document.getElementById('siguienteBtn').hidden = false;
          }
        }

      } catch (err) {
        console.error('[Online] Error responder:', err);
        document.querySelectorAll('.opcion-btn').forEach(b => b.disabled = false);
        respondida = false;
      }
    }

    // ── Finalizar partida (terminé todas las preguntas) ───────
    async function finalizarPartida() {
      if (partidaTerminada) return;
      partidaTerminada = true;

      // Guardar sesión en el backend
      try {
        await fetch(`${API}/juego/sesiones/${sesionId}/finalizar`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });
      } catch (_) {}

      // Enviar aciertos al servidor para que compare con el rival
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'finish', correctas }));
      }

      // Mostrar pantalla de espera mientras el rival termina
      document.getElementById('enunciado').textContent = '⏳ Esperando que tu rival termine...';
      document.getElementById('opcionesGrid').innerHTML = '';
      document.getElementById('siguienteBtn').hidden = true;
      document.getElementById('explicacion').hidden = true;
      play('/static/arcade_stat.mp3');
    }

    // ── Overlays ──────────────────────────────────────────────
    function mostrarOverlay(id) {
      document.getElementById(id).classList.add('overlay-fin--active');
      if (ws) ws.close();
    }

    function volverInicio() {
      sessionStorage.removeItem('online_state');
      sessionStorage.removeItem('online_progreso');
      location.replace('dashboard_estudiante.html');
    }

    document.getElementById('btnGanaOk').addEventListener('click', volverInicio);
    document.getElementById('btnPierdeOk').addEventListener('click', volverInicio);
    document.getElementById('btnDescOk').addEventListener('click', volverInicio);
    document.getElementById('btnEmpateOk').addEventListener('click', volverInicio);

    // ── Botón Siguiente ───────────────────────────────────────
    document.getElementById('siguienteBtn').addEventListener('click', () => {
      play('/static/sig_pregun.mp3');
      actual++;
      guardarProgreso();
      if (actual >= preguntas.length) {
        finalizarPartida();
      } else {
        mostrarPregunta();
      }
    });

    // ── Botón Volver ──────────────────────────────────────────
    document.getElementById('backBtn').addEventListener('click', () => {
      if (ws) ws.close();
      sessionStorage.removeItem('online_state');
      location.replace('dashboard_estudiante.html');
    });

    // ── Evitar bfcache ────────────────────────────────────────
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) location.replace('dashboard_estudiante.html');
    });

    init();
  </script>
</body>
</html>
