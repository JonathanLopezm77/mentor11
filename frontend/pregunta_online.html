<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor 11 — Online</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/libre.css" />
  <link rel="stylesheet" href="/static/css/resultado_componente.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet" />
  <style>
    /* ── Banner VS con avatares en los bordes y barras debajo ── */
    .vs-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: #1c1917;
      margin: 10px 16px 0;
      padding: 8px 14px;
      border-radius: 18px;
    }
    .vs-banner__side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 38%;
    }
    .vs-banner__avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2.5px solid var(--orange-500);
      background: var(--orange-100);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .vs-banner__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .vs-banner__avatar span { font-weight: 800; color: var(--orange-600); font-size: 1.4rem; }
    .vs-banner__name {
      font-size: .68rem;
      font-weight: 700;
      color: #cbd5e1;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vs-banner__bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, .14);
      border-radius: 99px;
      overflow: hidden;
    }
    .vs-banner__bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width .4s ease;
    }
    .vs-banner__bar-fill--yo    { background: var(--orange-500); }
    .vs-banner__bar-fill--rival { background: #f59e0b; }
    .vs-banner__badge {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform: rotate(-8deg);
      margin-top: 4px;
    }
    .vs-banner__badge span {
      font-family: 'Bangers', 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 2.6rem;
      line-height: 1;
      color: #fff;
      -webkit-text-stroke: 2px #000;
      letter-spacing: .02em;
    }

    /* ── Barra de poderes ── */
    .poderes-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px 16px 0;
    }
    .poder-btn {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      border: 2px solid var(--gray-200);
      background: #fff;
      padding: 5px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .poder-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .poder-btn:active:not(:disabled) { transform: scale(.9); }
    .poder-btn:not(:disabled):hover { border-color: var(--orange-500); }
    .poder-btn:disabled { opacity: .35; cursor: not-allowed; filter: grayscale(1); }

    /* ── Aviso flotante de poderes ── */
    .poder-toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: #1c1917;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 700;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
      max-width: 85%;
      text-align: center;
    }
    .poder-toast--visible { opacity: 1; }

    /* ── Overlays de fin de partida ── */
    .overlay-fin {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 32px 24px;
    }
    .overlay-fin--active { display: flex; }
    .overlay-fin__card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .overlay-fin__icon  { font-size: 4rem; line-height: 1; }
    .overlay-fin__avatarwrap { display: flex; justify-content: center; }
    .overlay-fin__title { font-size: 1.7rem; font-weight: 800; color: var(--gray-900); }
    .overlay-fin__sub   { font-size: .92rem; color: var(--gray-500); }
    .overlay-fin__btn   {
      margin-top: 8px;
      padding: 14px 32px;
      background: var(--orange-500);
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      width: 100%;
    }
  </style>
</head>
<body class="libre-body">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="libre-header">
    <button class="libre-back" id="backBtn" aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 class="libre-header__title">Online</h1>
    <span class="libre-contador" id="contador">1 / ?</span>
  </header>

  <!-- ── Banner VS: avatares en los bordes, barras debajo ───── -->
  <div class="vs-banner">
    <div class="vs-banner__side">
      <div class="vs-banner__avatar" id="vsAvatarYo"><span id="vsIniYo">?</span></div>
      <span class="vs-banner__name" id="labelYo">Tú</span>
      <div class="vs-banner__bar-track"><div class="vs-banner__bar-fill vs-banner__bar-fill--yo" id="barYo"></div></div>
    </div>
    <div class="vs-banner__badge"><span>VS</span></div>
    <div class="vs-banner__side">
      <div class="vs-banner__avatar" id="vsAvatarRival"><span id="vsIniRival">?</span></div>
      <span class="vs-banner__name" id="labelRival">Rival</span>
      <div class="vs-banner__bar-track"><div class="vs-banner__bar-fill vs-banner__bar-fill--rival" id="barRival"></div></div>
    </div>
  </div>

  <!-- ── Barra de poderes ────────────────────────────────────── -->
  <div class="poderes-bar" id="poderesBar"></div>

  <!-- ── Contenido principal ────────────────────────────────── -->
  <main class="pregunta-main">
    <div class="pregunta-card">
      <p class="pregunta-enunciado" id="enunciado">Conectando...</p>
    </div>
    <div class="opciones-grid" id="opcionesGrid"></div>
    <div class="pregunta-explicacion" id="explicacion" hidden></div>
  </main>

  <!-- ── Botón siguiente ────────────────────────────────────── -->
  <div class="libre-footer">
    <button class="libre-cta" id="siguienteBtn" hidden>Siguiente →</button>
  </div>

  <!-- ── Overlay: ganaste ───────────────────────────────────── -->
  <div class="overlay-fin" id="overlayGana">
    <div class="overlay-fin__card">
      <div class="overlay-fin__avatarwrap" id="ganaAvatarWrap"></div>
      <p class="overlay-fin__title">¡Ganaste!</p>
      <p class="overlay-fin__sub" id="ganaSubtitle">¡Excelente!</p>
      <div class="rc-comparativa" id="ganaComparativa"></div>
      <button class="overlay-fin__btn" id="btnGanaOk">Volver al inicio</button>
    </div>
  </div>

  <!-- ── Overlay: perdiste ──────────────────────────────────── -->
  <div class="overlay-fin" id="overlayPierde">
    <div class="overlay-fin__card">
      <div class="overlay-fin__avatarwrap" id="pierdeAvatarWrap"></div>
      <p class="overlay-fin__title">¡Tu rival ganó!</p>
      <p class="overlay-fin__sub" id="pierdeSubtitle">Sigue practicando, ¡la próxima es tuya!</p>
      <div class="rc-comparativa" id="pierdeComparativa"></div>
      <button class="overlay-fin__btn" id="btnPierdeOk">Volver al inicio</button>
    </div>
  </div>

  <!-- ── Overlay: empate ───────────────────────────────────── -->
  <div class="overlay-fin" id="overlayEmpate">
    <div class="overlay-fin__card">
      <span class="overlay-fin__icon">🤝</span>
      <p class="overlay-fin__title">¡Empate!</p>
      <p class="overlay-fin__sub" id="empateSubtitle">Los dos respondieron igual de bien.</p>
      <div class="rc-comparativa" id="empateComparativa"></div>
      <button class="overlay-fin__btn" id="btnEmpateOk">Volver al inicio</button>
    </div>
  </div>

  <!-- ── Overlay: rival desconectado ───────────────────────── -->
  <div class="overlay-fin" id="overlayDesc">
    <div class="overlay-fin__card">
      <span class="overlay-fin__icon">🔌</span>
      <p class="overlay-fin__title">Rival desconectado</p>
      <p class="overlay-fin__sub">Tu rival abandonó la partida.</p>
      <button class="overlay-fin__btn" id="btnDescOk">Volver al inicio</button>
    </div>
  </div>

  <script src="/static/js/resultado_componente.js"></script>
  <script>
    // ── Sonidos ────────────────────────────────────────────────
    const SFX = {};
    [['/static/correcta.mp3',.8],['/static/error.mp3',.8],
     ['/static/sig_pregun.mp3',.7],['/static/arcade_stat.mp3',.6],
     ['/static/poder_cambiarorden.mp3',.6],['/static/poder_mitadmitad.mp3',.6],
     ['/static/poder_x2.mp3',.6],['/static/poder_robarp.mp3',.6],
     ['/static/poder_75.mp3',.6],['/static/poder_devolverrival2.mp3',.6],
     ['/static/poder_equivocar.mp3',.6],['/static/poder_congelar.mp3',.6]].forEach(([src,vol]) => {
      const a = new Audio(src); a.preload = 'auto'; a.volume = vol; SFX[src] = a;
    });
    const play = src => { const a = SFX[src]; if (!a) return; a.currentTime = 0; a.play().catch(()=>{}); };

    // Sonido de cada poder — el mismo suena para quien lo activa y para quien lo recibe
    const SONIDOS_PODER = {
      cambiar_orden: '/static/poder_cambiarorden.mp3',
      mitad_mitad: '/static/poder_mitadmitad.mp3',
      doble_puntos: '/static/poder_x2.mp3',
      robar_poder: '/static/poder_robarp.mp3',
      setenta_cinco: '/static/poder_75.mp3',
      devolver_rival_2: '/static/poder_devolverrival2.mp3',
      equivocarse: '/static/poder_equivocar.mp3',
      congelar: '/static/poder_congelar.mp3',
    };
    const playPoder = (poderId) => { const src = SONIDOS_PODER[poderId]; if (src) play(src); };

    // ── Poderes: iconos y nombres ────────────────────────────────
    const ICONOS_PODER = {
      cambiar_orden: '/static/img/p_cambiarorden.png',
      mitad_mitad: '/static/img/p_mitadmitad.png',
      doble_puntos: '/static/img/p_x2.png',
      robar_poder: '/static/img/p_robarp.png',
      setenta_cinco: '/static/img/p_75.png',
      devolver_rival_2: '/static/img/p_devolverrival2.png',
      equivocarse: '/static/img/p_equivocar.png',
      congelar: '/static/img/P_CONGELAR.png',
    };
    const NOMBRES_PODER = {
      cambiar_orden: 'Cambiar orden',
      mitad_mitad: 'Mitad y mitad',
      doble_puntos: 'x2 puntos',
      robar_poder: 'Robar poder',
      setenta_cinco: '75%',
      devolver_rival_2: 'Devolver 2',
      equivocarse: 'Equivocarse',
      congelar: 'Congelar',
    };

    function mostrarToast(msg) {
      let t = document.getElementById('poderToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'poderToast';
        t.className = 'poder-toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.add('poder-toast--visible');
      clearTimeout(t._timeout);
      t._timeout = setTimeout(() => t.classList.remove('poder-toast--visible'), 2200);
    }

    // ── Estado desde sessionStorage ───────────────────────────
    const API = '/api/v1';
    const token = localStorage.getItem('access_token');
    const onlineState = JSON.parse(sessionStorage.getItem('online_state') ?? 'null');

    if (!token || !onlineState) { location.replace('online_intro.html'); }

    const { room_id, rival, modo, username } = onlineState;

    document.getElementById('labelYo').textContent = username ?? 'Tú';
    document.getElementById('labelRival').textContent = rival ?? 'Rival';

    // ── Banner VS: avatares ────────────────────────────────────
    document.getElementById('vsIniYo').textContent = (username ?? '?').charAt(0).toUpperCase();
    document.getElementById('vsIniRival').textContent = (rival ?? '?').charAt(0).toUpperCase();

    // Precarga la imagen y solo la muestra si carga bien — si el avatar
    // (PNG de 500x500px en base64) llega corrupto o incompleto por una
    // conexión móvil lenta, se queda con la inicial en vez de un ícono roto.
    function pintarAvatar(contenedorId, iniId, src) {
      if (!src || !src.startsWith('data:image')) return;
      const cont = document.getElementById(contenedorId);
      const ini = document.getElementById(iniId);
      const img = new Image();
      img.alt = 'Avatar';
      img.onload = () => { cont.insertBefore(img, ini); ini.hidden = true; };
      img.onerror = () => {}; // se queda con la inicial que ya estaba
      img.src = src;
    }

    if (onlineState.rival_avatar) pintarAvatar('vsAvatarRival', 'vsIniRival', onlineState.rival_avatar);

    // Se guarda para reutilizarlo en la pantalla de resultado (evita
    // pedirlo de nuevo al backend cuando termina la partida).
    let miAvatarSrc = null;

    (async () => {
      try {
        const res = await fetch(`${API}/perfil/avatar`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) return;
        const data = await res.json();
        if (data.imagen_src) {
          miAvatarSrc = data.imagen_src;
          pintarAvatar('vsAvatarYo', 'vsIniYo', data.imagen_src);
        }
      } catch (_) {}
    })();

    let ws = null;
    let respondida = false;
    let partidaTerminada = false;

    // ── Poderes: estado e interfaz ─────────────────────────────
    let poderes = onlineState.poderes ?? {};
    let congeladoHasta = 0;
    let ordenAlteradoHasta = 0;
    let ordenIntervalId = null;

    function renderPoderes() {
      const cont = document.getElementById('poderesBar');
      cont.innerHTML = '';
      Object.keys(poderes).forEach((poderId) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'poder-btn';
        btn.title = NOMBRES_PODER[poderId] || poderId;
        btn.disabled = !(poderes[poderId] > 0);
        btn.innerHTML = `<img src="${ICONOS_PODER[poderId] || ''}" alt="${NOMBRES_PODER[poderId] || poderId}" />`;
        btn.addEventListener('click', () => usarPoder(poderId));
        cont.appendChild(btn);
      });
    }

    function usarPoder(poderId) {
      if (!(poderes[poderId] > 0) || partidaTerminada) return;
      if (poderId === 'mitad_mitad') { usarMitadMitad(); return; }
      if (poderId === 'setenta_cinco') { usarSetentaCinco(); return; }
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'usar_poder', poder: poderId }));
    }

    async function usarMitadMitad() {
      if (respondida || partidaTerminada) return;
      const preguntaActual = preguntas[actual];
      if (!preguntaActual) return;
      try {
        const res = await fetch(`${API}/juego/poderes/mitad_mitad`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ pregunta_id: preguntaActual.id }),
        });
        if (!res.ok) return;
        const data = await res.json();
        data.ocultar_ids.forEach((id) => {
          const btn = document.querySelector(`.opcion-btn[data-id="${id}"]`);
          if (btn) { btn.disabled = true; btn.style.visibility = 'hidden'; }
        });
        poderes.mitad_mitad = 0;
        renderPoderes();
        playPoder('mitad_mitad');
        mostrarToast('✂️ ¡Mitad y mitad! Se eliminaron 2 opciones incorrectas.');
      } catch (_) {}
    }

    async function usarSetentaCinco() {
      if (respondida || partidaTerminada) return;
      const preguntaActual = preguntas[actual];
      if (!preguntaActual) return;
      respondida = true;
      document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = true));
      try {
        const res = await fetch(`${API}/juego/sesiones/${sesionId}/poderes/setenta_cinco`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ pregunta_id: preguntaActual.id }),
        });
        if (!res.ok) {
          respondida = false;
          document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = false));
          return;
        }
        const data = await res.json();
        poderes.setenta_cinco = 0;
        renderPoderes();
        playPoder('setenta_cinco');
        mostrarToast('🎯 ¡75% activado! El sistema respondió por ti.');
        procesarRespuesta(data, data.opcion_elegida_id);
      } catch (_) {
        respondida = false;
        document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = false));
      }
    }

    function reordenarOpciones() {
      const grid = document.getElementById('opcionesGrid');
      const btns = [...grid.children];
      for (let i = btns.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [btns[i], btns[j]] = [btns[j], btns[i]];
      }
      btns.forEach((b) => grid.appendChild(b));
    }

    function aplicarOrdenAlterado(duracionS) {
      ordenAlteradoHasta = Date.now() + duracionS * 1000;
      playPoder('cambiar_orden');
      mostrarToast('🔀 ¡Tu rival desordenó tus respuestas por ' + duracionS + 's!');
      reordenarOpciones();
      if (ordenIntervalId) clearInterval(ordenIntervalId);
      ordenIntervalId = setInterval(() => {
        if (Date.now() >= ordenAlteradoHasta) {
          clearInterval(ordenIntervalId);
          ordenIntervalId = null;
          return;
        }
        reordenarOpciones();
      }, 2500);
    }

    function aplicarCongelado(duracionS) {
      congeladoHasta = Date.now() + duracionS * 1000;
      document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = true));
      document.getElementById('siguienteBtn').disabled = true;
      playPoder('congelar');
      mostrarToast('❄️ ¡Tu rival te congeló por ' + duracionS + 's!');
      const intervalo = setInterval(() => {
        if (Date.now() >= congeladoHasta) {
          clearInterval(intervalo);
          if (!respondida) document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = false));
          document.getElementById('siguienteBtn').disabled = false;
        }
      }, 500);
    }

    function aplicarRepetirPreguntas(cantidad) {
      const disponibles = Math.min(cantidad, actual);
      if (disponibles <= 0) return;
      const aRepetir = preguntas.slice(actual - disponibles, actual).map((p) => ({ ...p }));
      preguntas = preguntas.concat(aRepetir);
      guardarProgreso();
      playPoder('devolver_rival_2');
      mostrarToast('↩️ ¡Tu rival te hizo repetir ' + disponibles + ' pregunta' + (disponibles > 1 ? 's' : '') + '!');
    }

    // ── Restaurar progreso si hubo recarga ────────────────────
    const _progreso = JSON.parse(sessionStorage.getItem('online_progreso') ?? 'null');
    let sesionId    = _progreso?.sesionId    ?? null;
    let preguntas   = _progreso?.preguntas   ?? [];
    let actual      = _progreso?.actual      ?? 0;
    let correctas   = _progreso?.correctas   ?? 0;
    let incorrectas = _progreso?.incorrectas ?? 0;
    let materiaIds  = _progreso?.materiaIds  ?? null;

    // Meta: cuántas respuestas correctas hacen falta para llenar la barra.
    // No hay límite de preguntas — se siguen cargando más hasta llegar a la meta.
    const meta = onlineState.cantidad ?? 10;
    let vistasIds = new Set(_progreso?.vistasIds ?? []);
    let cargandoMas = false;

    function guardarProgreso() {
      sessionStorage.setItem('online_progreso', JSON.stringify({
        sesionId, preguntas, actual, correctas, incorrectas, materiaIds, vistasIds: [...vistasIds],
      }));
    }

    async function cargarMasPreguntas() {
      if (cargandoMas || !materiaIds) return;
      cargandoMas = true;
      try {
        const excluir = [...vistasIds].slice(-60).join(',');
        const url = `${API}/juego/preguntas?materia_ids=${materiaIds}&cantidad=15` + (excluir ? `&excluir_ids=${excluir}` : '');
        const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) {
          const nuevas = await res.json();
          for (const p of nuevas) {
            if (!vistasIds.has(p.id)) { preguntas.push(p); vistasIds.add(p.id); }
          }
        }
      } catch (_) {}
      cargandoMas = false;
    }

    // Vincula la sesión REST con la sala del WebSocket para que el servidor
    // pueda finalizar (y liquidar los puntos de) esta sesión al terminar la partida.
    // Se llama tanto al abrir la conexión como justo al crear la sesión, porque
    // cualquiera de las dos puede ocurrir primero.
    function vincularSesion() {
      if (sesionId && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'vincular_sesion', sesion_id: sesionId }));
      }
    }

    // ── WebSocket ─────────────────────────────────────────────
    function conectarWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/online?token=${token}&username=${encodeURIComponent(username)}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join_room', room_id }));
        vincularSesion();
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'rival_progress') {
          document.getElementById('barRival').style.width = (data.value ?? 0) + '%';
        }

        if (data.type === 'resultado') {
          // La partida termina apenas alguno de los 2 llena su barra —
          // puede llegar aunque yo siga respondiendo, así que se corta ya.
          partidaTerminada = true;
          document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = true));
          document.getElementById('siguienteBtn').hidden = true;

          const misCorrectasReal = data.mis_correctas != null ? data.mis_correctas : correctas;
          const miTexto = `${data.mis_puntos} pts (${misCorrectasReal} correctas)`;
          const rivalTexto = data.rival_correctas != null
            ? `${data.rival_puntos} pts (${data.rival_correctas} correctas)`
            : `${data.rival_puntos} pts (se quedó en ${data.rival_progreso_pct ?? 0}% de su barra)`;

          // Bloque comparativo (avatar + nombre + correctas + puntos de cada
          // jugador), igual para los 3 desenlaces — solo cambia quién gana.
          function construirComparativa(contenedorId, yoGane, rivalGane) {
            const cont = document.getElementById(contenedorId);
            cont.innerHTML = '';
            cont.appendChild(RC.crearPlayerRow({
              avatarSrc: miAvatarSrc,
              nombre: username,
              correctas: misCorrectasReal,
              puntos: data.mis_puntos,
              esGanador: yoGane,
            }));
            cont.appendChild(RC.crearPlayerRow({
              avatarSrc: onlineState.rival_avatar,
              nombre: rival,
              correctas: data.rival_correctas,
              puntos: data.rival_puntos,
              esGanador: rivalGane,
              nota: data.rival_correctas != null ? null : `se quedó en ${data.rival_progreso_pct ?? 0}%`,
            }));
          }

          if (data.empate) {
            document.getElementById('empateSubtitle').textContent = `Ambos con ${data.mis_puntos} puntos.`;
            construirComparativa('empateComparativa', false, false);
            mostrarOverlay('overlayEmpate');
          } else if (data.ganaste) {
            document.getElementById('ganaSubtitle').textContent = `Tú: ${miTexto} · Rival: ${rivalTexto}`;
            document.getElementById('ganaAvatarWrap').appendChild(RC.crearAvatar(miAvatarSrc, username, 'lg'));
            construirComparativa('ganaComparativa', true, false);
            mostrarOverlay('overlayGana');
          } else {
            document.getElementById('pierdeSubtitle').textContent = `Rival: ${rivalTexto} · Tú: ${miTexto}`;
            document.getElementById('pierdeAvatarWrap').appendChild(RC.crearAvatar(onlineState.rival_avatar, rival, 'lg'));
            construirComparativa('pierdeComparativa', false, true);
            mostrarOverlay('overlayPierde');
          }

          // Refresca los puntos reales ya liquidados por el servidor, para
          // que el dashboard muestre el total correcto al volver.
          (async () => {
            try {
              const res = await fetch(`${API}/perfil/me`, { headers: { Authorization: `Bearer ${token}` } });
              if (res.ok) {
                const perfil = await res.json();
                const usuario = JSON.parse(localStorage.getItem('usuario') ?? '{}');
                usuario.puntos_totales = perfil.puntos_totales;
                localStorage.setItem('usuario', JSON.stringify(usuario));
              }
            } catch (_) {}
          })();
        }

        if (data.type === 'rival_disconnected') {
          // La partida se anula sin puntos para nadie — no se muestra como
          // una victoria (sería engañoso), sino como lo que es: se cortó.
          partidaTerminada = true;
          document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = true));
          document.getElementById('siguienteBtn').hidden = true;
          mostrarOverlay('overlayDesc');
        }

        if (data.type === 'room_not_found') {
          // La sala ya no existe — se continúa sin rival
        }

        if (data.type === 'rejoined' && data.poderes) {
          poderes = data.poderes;
          renderPoderes();
        }

        // ── Poderes propios confirmados por el servidor ──────────
        if (data.type === 'poder_usado') {
          poderes[data.poder] = 0;
          renderPoderes();
          playPoder(data.poder);
        }

        if (data.type === 'poder_error') {
          mostrarToast(data.mensaje || 'No se pudo usar el poder');
        }

        if (data.type === 'efecto_propio') {
          if (data.poder === 'doble_puntos') mostrarToast('⚡ ¡x2 puntos activado por ' + data.duracion_s + 's!');
          if (data.poder === 'equivocarse') mostrarToast('🤞 ¡Protegido del próximo error!');
        }

        if (data.type === 'inventario_actualizado') {
          poderes = data.poderes;
          renderPoderes();
          playPoder('robar_poder');
          if (data.robado) mostrarToast('🎯 ¡Le robaste "' + (NOMBRES_PODER[data.robado] || data.robado) + '" a tu rival!');
          else mostrarToast('⚠️ ¡Tu rival te robó un poder!');
        }

        // ── Poderes del rival que me afectan a mí ────────────────
        if (data.type === 'orden_alterado') {
          aplicarOrdenAlterado(data.duracion_s ?? 30);
        }

        if (data.type === 'congelado') {
          aplicarCongelado(data.duracion_s ?? 20);
        }

        if (data.type === 'repetir_preguntas') {
          aplicarRepetirPreguntas(data.cantidad ?? 2);
        }
      };

      ws.onerror = () => {};
      ws.onclose = () => {};
    }

    // ── Cargar materias y preguntas ───────────────────────────
    async function init() {
      renderPoderes();
      conectarWS();

      // Si hay progreso guardado (recarga), restaurar directamente
      if (_progreso && preguntas.length > 0) {
        const pct = Math.min(100, Math.round((correctas / meta) * 100));
        document.getElementById('barYo').style.width = pct + '%';
        mostrarPregunta();
        return;
      }

      try {
        if (modo === 'libre' && onlineState.materia_ids) {
          materiaIds = onlineState.materia_ids.join(',');
        } else {
          const matRes = await fetch(`${API}/juego/materias`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!matRes.ok) throw new Error('materias');
          const materias = await matRes.json();
          materiaIds = materias.map(m => m.id).join(',');
        }

        // Crear sesión
        const sesRes = await fetch(`${API}/juego/sesiones`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({
            modo_juego: modo === 'libre' ? 'libre' : 'aleatorio',
            materia_ids: materiaIds.split(',').map(Number),
            total_preguntas: meta,
          })
        });
        if (!sesRes.ok) throw new Error('sesion');
        const sesData = await sesRes.json();
        sesionId = sesData.sesion_id;
        vincularSesion();

        // Cargar el primer lote de preguntas (no hay límite total — se piden más sobre la marcha)
        await cargarMasPreguntas();

        if (!preguntas.length) {
          document.getElementById('enunciado').textContent = 'No hay preguntas disponibles.';
          return;
        }

        guardarProgreso();
        mostrarPregunta();
      } catch (err) {
        console.error('[Online] Error init:', err);
        document.getElementById('enunciado').textContent = 'Error de conexión. Recarga.';
      }
    }

    // ── Mostrar pregunta ──────────────────────────────────────
    function mostrarPregunta() {
      if (correctas >= meta) {
        finalizarPartida();
        return;
      }
      if (preguntas.length - actual <= 4) cargarMasPreguntas();
      if (actual >= preguntas.length) {
        document.getElementById('enunciado').textContent = 'Cargando siguiente pregunta...';
        setTimeout(mostrarPregunta, 500);
        return;
      }
      respondida = false;

      const p = preguntas[actual];
      document.getElementById('contador').textContent = `${correctas} / ${meta} ✔`;
      document.getElementById('enunciado').textContent = p.enunciado;
      document.getElementById('explicacion').hidden = true;
      document.getElementById('explicacion').textContent = '';
      document.getElementById('siguienteBtn').hidden = true;

      const grid = document.getElementById('opcionesGrid');
      grid.innerHTML = '';
      p.opciones.forEach(op => {
        const btn = document.createElement('button');
        btn.className = 'opcion-btn';
        btn.dataset.id = op.id;
        btn.innerHTML = `<span class="opcion-letra">${op.letra}</span><span class="opcion-texto">${op.texto}</span>`;
        btn.addEventListener('click', () => responder(op.id, p.id));
        grid.appendChild(btn);
      });

      // Si sigue activo un efecto del rival, se respeta también en la nueva pregunta
      if (Date.now() < ordenAlteradoHasta) reordenarOpciones();
      if (Date.now() < congeladoHasta) {
        document.querySelectorAll('.opcion-btn').forEach((b) => (b.disabled = true));
        document.getElementById('siguienteBtn').disabled = true;
      }
    }

    // ── Procesa el resultado de una respuesta (manual o vía 75%) ──
    function procesarRespuesta(data, opcionElegidaId) {
      document.querySelectorAll('.opcion-btn').forEach(btn => {
        const id = Number(btn.dataset.id);
        if (id === data.opcion_correcta_id) btn.classList.add('opcion-btn--correcta');
        else if (id === opcionElegidaId && !data.es_correcta) btn.classList.add('opcion-btn--incorrecta');
      });

      const contoComoCorrecta = data.es_correcta || data.proteccion_usada;
      if (contoComoCorrecta) {
        correctas++;
        play('/static/correcta.mp3');
      } else {
        incorrectas++;
        play('/static/error.mp3');
      }
      if (data.proteccion_usada) mostrarToast('🤞 ¡Protección activada! Ese error no cuenta.');

      // Barra llena según respuestas correctas, hasta la meta
      const pct = Math.min(100, Math.round((correctas / meta) * 100));
      document.getElementById('barYo').style.width = pct + '%';
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'progress', value: pct }));
      }

      guardarProgreso();

      if (data.explicacion) {
        const exp = document.getElementById('explicacion');
        exp.textContent = `💡 ${data.explicacion}`;
        exp.hidden = false;
      }

      if (contoComoCorrecta) {
        if (correctas >= meta) {
          document.getElementById('siguienteBtn').textContent = 'Ver resultado';
          document.getElementById('siguienteBtn').hidden = false;
        } else {
          setTimeout(() => { actual++; guardarProgreso(); mostrarPregunta(); }, 900);
        }
      } else {
        document.getElementById('siguienteBtn').textContent = 'Siguiente →';
        document.getElementById('siguienteBtn').hidden = false;
      }
    }

    // ── Responder ─────────────────────────────────────────────
    async function responder(opcionId, preguntaId) {
      if (respondida || partidaTerminada) return;
      respondida = true;
      document.querySelectorAll('.opcion-btn').forEach(b => b.disabled = true);

      try {
        const res = await fetch(`${API}/juego/sesiones/${sesionId}/responder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ pregunta_id: preguntaId, opcion_id: opcionId })
        });
        const data = await res.json();
        procesarRespuesta(data, opcionId);
      } catch (err) {
        console.error('[Online] Error responder:', err);
        document.querySelectorAll('.opcion-btn').forEach(b => b.disabled = false);
        respondida = false;
      }
    }

    // ── Finalizar partida (terminé todas las preguntas) ───────
    function finalizarPartida() {
      if (partidaTerminada) return;
      partidaTerminada = true;

      // El servidor finaliza y liquida los puntos de ambos jugadores al
      // recibir 'finish' (usa la sesión vinculada con vincularSesion()).
      // El cliente ya NO llama a /finalizar directamente, para que la
      // sesión no se liquide dos veces.
      //
      // Avisar al servidor: mi barra se llenó primero — la partida termina ya
      // para los dos, no hay que esperar a que el rival también termine.
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'finish', correctas }));
      }

      document.getElementById('enunciado').textContent = '🏁 ¡Llenaste tu barra! Cerrando la partida...';
      document.getElementById('opcionesGrid').innerHTML = '';
      document.getElementById('siguienteBtn').hidden = true;
      document.getElementById('explicacion').hidden = true;
      play('/static/arcade_stat.mp3');
    }

    // ── Overlays ──────────────────────────────────────────────
    function mostrarOverlay(id) {
      document.getElementById(id).classList.add('overlay-fin--active');
      if (ws) ws.close();
    }

    function volverInicio() {
      sessionStorage.removeItem('online_state');
      sessionStorage.removeItem('online_progreso');
      location.replace('dashboard_estudiante.html');
    }

    document.getElementById('btnGanaOk').addEventListener('click', volverInicio);
    document.getElementById('btnPierdeOk').addEventListener('click', volverInicio);
    document.getElementById('btnDescOk').addEventListener('click', volverInicio);
    document.getElementById('btnEmpateOk').addEventListener('click', volverInicio);

    // ── Botón Siguiente ───────────────────────────────────────
    document.getElementById('siguienteBtn').addEventListener('click', () => {
      play('/static/sig_pregun.mp3');
      actual++;
      guardarProgreso();
      mostrarPregunta();
    });

    // ── Botón Volver ──────────────────────────────────────────
    document.getElementById('backBtn').addEventListener('click', () => {
      if (ws) ws.close();
      sessionStorage.removeItem('online_state');
      location.replace('dashboard_estudiante.html');
    });

    // ── Evitar bfcache ────────────────────────────────────────
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) location.replace('dashboard_estudiante.html');
    });

    init();
  </script>
</body>
